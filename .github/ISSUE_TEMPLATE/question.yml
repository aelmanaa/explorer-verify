name: Question
description: Ask how to do something with explorer-verify, after checking the docs.
labels: ["type:question", "status:needs-triage"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: explorer-verify and Node.js or browser.
      placeholder: explorer-verify 0.1.0, Node.js 24.16.0
