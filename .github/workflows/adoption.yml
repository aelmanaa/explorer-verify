name: Adoption validation

on:
  pull_request:
    paths:
      - validation/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/adoption.yml
  push:
    branches: [main]
    paths:
      - validation/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/adoption.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  consumer:
    name: Adoption (${{ matrix.project }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [browser-remix, ccip, hardhat, cli-comparison, polyglot]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Python for the subprocess consumer
        if: matrix.project == 'polyglot'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Go for the subprocess consumer
        if: matrix.project == 'polyglot'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Java for the subprocess consumer
        if: matrix.project == 'polyglot'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Foundry for the CLI comparison
        if: matrix.project == 'cli-comparison'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser runtime
        if: matrix.project == 'browser-remix'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run the independent consumer
        run: node validation/run.mjs --project '${{ matrix.project }}' --output "$RUNNER_TEMP/adoption"
      - name: Preserve evidence and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adoption-${{ matrix.project }}
          path: ${{ runner.temp }}/adoption/
          if-no-files-found: warn
          retention-days: 30
