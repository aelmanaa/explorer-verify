# Keeps the Version Packages pull request current. On every push to main, changesets/action runs
# `pnpm run version-packages` (changeset version, the released error codes, the version line of
# each user page, then the lockfile) on the branch changeset-release/main and opens or updates the
# pull request from it. It publishes nothing and creates no tag: a release starts only from a
# maintainer-signed tag (release.yml).
#
# The `packages` job runs `scripts/release-packages.ts --any`. While every packages/*/package.json
# is private, it prints false, the `version-pr` job is skipped and the run passes: before the first
# release (decision 0017) a Version Packages pull request is not wanted.
# scripts/check-release-workflows.ts, part of `pnpm run check`, fails when this gate goes away.
#
# A GitHub App token lets pull request checks run without a separate workflow approval.
# The App is installed on this repository only. Each job requests only Contents and Pull requests
# write access, and the token action revokes its installation token when the job finishes.
# docs/contributor/releasing.md has the steps.
name: Release pull request

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  packages:
    name: Published packages
    if: github.repository == 'aelmanaa/explorer-verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check for a published package
        id: list
        run: |
          any="$(node scripts/release-packages.ts --any)"
          echo "any=${any}" >> "$GITHUB_OUTPUT"
          if [ "${any}" != true ]; then
            echo "Every package is private: no Version Packages pull request until the first release." >> "$GITHUB_STEP_SUMMARY"
          fi

  version-pr:
    name: Version Packages pull request
    needs: packages
    if: needs.packages.outputs.any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # changelog metadata; the separate token writes the pull request
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changeset version reads the history of each changeset for the changelog links.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: the job holds a write token, so it restores nothing another run saved.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create the version pull request token
        id: release-app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: explorer-verify
          permission-contents: write
          permission-pull-requests: write
      # No publish script: with no changeset on main the action does nothing.
      - name: Open or update the Version Packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-app.outputs.token }}
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
