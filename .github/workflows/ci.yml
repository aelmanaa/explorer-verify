name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lockfile has no duplicate copies (run `pnpm dedupe` to fix)
        run: pnpm dedupe --check --ignore-scripts
      - run: pnpm run check

  test:
    # Node 22.18.0 is the floor of the repository's scripts and tests, which run TypeScript natively
    # (the root package.json engines); keep the first leg equal to it. The published packages'
    # lower floor is tested by the node-floor job (decision 0071). The supported lines follow
    # Node's LTS schedule: docs/contributor/decisions/0060-supported-node-versions-follow-lts.md.
    name: Test (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24.0.0", "26.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  # The published packages declare engines.node >=22.12.0, below the 22.18.0 the repository's own
  # TypeScript scripts and tests need (decision 0071). This job tests that floor: it builds and packs
  # the four packages on Node 24, installs the tarballs with npm into an empty folder on Node
  # 22.12.0, and runs test/node-floor/smoke.mjs there. Keep NODE_FLOOR equal to engines.node;
  # scripts/test/node-floor.test.ts checks it.
  node-floor:
    name: Packages on the Node floor
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      NODE_FLOOR: "22.12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # pnpm pack rewrites the workspace: ranges, so npm can install the tarballs.
      - name: Pack the four packages
        run: |
          mkdir "$RUNNER_TEMP/tarballs"
          for dir in explorer-verify cli foundry hardhat; do
            (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs")
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_FLOOR }}
      - name: Install the tarballs and run the smoke test on the floor
        run: |
          test "$(node --version)" = "v$NODE_FLOOR"
          mkdir "$RUNNER_TEMP/floor"
          cd "$RUNNER_TEMP/floor"
          echo '{"name":"node-floor-smoke","private":true,"type":"module"}' > package.json
          npm install --no-audit --no-fund --ignore-scripts "$RUNNER_TEMP"/tarballs/*.tgz
          cp "$GITHUB_WORKSPACE/test/node-floor/smoke.mjs" .
          node smoke.mjs "$GITHUB_WORKSPACE"

  # The ruleset requires this job name. Besides coverage, the job runs the unit tests in a random
  # order.
  coverage:
    name: Coverage (95% floor)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run coverage
      # Runs the package and script unit tests again in a random order, so a test that depends on
      # another test's order or state fails. Each of the two runs prints its own seed; rerun a
      # failure with the seed of the run that failed (docs/contributor/testing.md). The step runs
      # here, on the latest Node 24, because Node added the option in 24.16.0 and 26.1.0: the
      # 22.18.0, 24.0.0 and 26.0.0 legs of the test matrix lack it. REQUIRE_RANDOM_ORDER=1 makes
      # scripts/node-test.ts fail instead of skip if this Node ever lacks the option.
      - name: Unit tests in a random order
        env:
          REQUIRE_RANDOM_ORDER: "1"
        run: pnpm run test:randomize

  package:
    name: Package (publint, attw, knip)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run pkg:check
      # Fails when a public entry, bundled for the browser, minified and gzipped, is above its
      # ceiling in size-budget.json (R-RUN-3, decision 0014), or when an exported name, built with
      # esbuild and Rollup, is above its ceiling in name-budget.json or has no row (decision 0042).
      - name: Bundle size within size-budget.json and name-budget.json
        run: pnpm run size

  # Builds the docs site from docs/user and the generated API reference with VitePress and checks
  # the build output: the docsUrl of every error code maps to a page with its Markdown copy, and
  # llms.txt lists only copies that exist (R-AX-10, R-AX-17, decision 0015). It never deploys: it has no Pages permission and
  # uploads nothing. .github/workflows/docs.yml deploys.
  site:
    name: Docs site build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # site:build first generates the API reference with TypeDoc (site/api-reference.ts). It fails
      # on an export without TSDoc, an unresolved {@link} or a type no entry point exports
      # (R-AX-2, R-DX-4).
      - run: pnpm run site:build
      - run: pnpm run site:check
      # The API reference is build output, not committed. A second run into another folder must
      # give the same pages, so the deployed reference depends only on the sources at the tag.
      - name: API reference is deterministic
        run: |
          node site/api-reference.ts "$RUNNER_TEMP/api"
          diff -r site/api "$RUNNER_TEMP/api"
      # Relative links and anchors in every tracked Markdown file and llms.txt, offline: a link to
      # a missing file or anchor fails the job. The list comes from git, so a new Markdown file is
      # checked without a change here. Left out: CHANGELOG.md files, which changesets writes;
      # .changeset/, the pending release notes; and site/pages/, whose root-relative site links
      # the built-site step below checks. External links are checked once a week by
      # .github/workflows/links.yml.
      - name: List the Markdown files to check
        run: |
          git ls-files -- '*.md' ':(exclude,glob)**/CHANGELOG.md' ':(exclude).changeset' ':(exclude)site/pages' \
            > "$RUNNER_TEMP/link-check-files.txt"
          echo llms.txt >> "$RUNNER_TEMP/link-check-files.txt"
      - name: Links and anchors in tracked Markdown files and llms.txt
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            --files-from "${{ runner.temp }}/link-check-files.txt"
          jobSummary: false
      # The site's links start with its base path, /explorer-verify/, and leave out .html. lychee
      # resolves the home link to .../site/dist/explorer-verify, without a trailing slash, so the
      # remap has none either.
      - name: Links and anchors in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --no-progress
            --root-dir "${{ github.workspace }}/site/dist"
            --remap "file://${{ github.workspace }}/site/dist/explorer-verify file://${{ github.workspace }}/site/dist"
            --fallback-extensions html --index-files index.html
            site/dist
          jobSummary: false

  # Bundles the core for the browser and runs verify() and checkStatus() in Node and in headless
  # Chromium against a local server that replays recorded Sourcify answers with Sourcify's CORS
  # headers (R-RUN-1; docs/contributor/testing.md). The headless shell
  # (about 100 MB) is cached per Playwright version; the system libraries it needs come from apt on
  # every run, because the cache holds only the browser.
  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Read the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          if [ -z "$version" ]; then
            echo "Could not read the Playwright version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium download
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium and install its system libraries
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run test:browser
      # Checks the smoke test itself: broken page scripts and missing CORS headers must fail it.
      - run: pnpm run test:browser:harness
