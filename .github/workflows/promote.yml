# Moves the `latest` dist-tag to a version the release workflow published under `beta`. Dispatched
# by a maintainer from main; docs/contributor/releasing.md has the steps. It never publishes a
# tarball: the only write is `npm dist-tag add`, so `latest` gets the same tarballs and provenance
# as `beta`.
# - verify: the version input is a plain X.Y.Z, the run is on main, and tag vX.Y.Z passes
#   scripts/verify-release-tag.ts again (signed by a key in .github/release-keys/, the packages'
#   version, its commit on main). Then scripts/check-registry-release.ts reads npm for each package
#   the tagged commit publishes: the version is on npm, `beta` points at it, its gitHead is the
#   tagged commit, `latest` is not above it, and its SLSA provenance statement names this
#   repository, .github/workflows/release.yml, refs/tags/vX.Y.Z and the tagged commit.
# - docs: calls docs.yml, which builds the docs from tag vX.Y.Z, deploys them to GitHub Pages and
#   checks every docsUrl over HTTPS (decision 0015). latest needs it, so a failed deploy or smoke
#   check stops the promote before any dist-tag moves.
# - latest: after a maintainer approves the npm-latest environment, the same registry check again,
#   then `npm dist-tag add <name>@<version> latest` over OIDC for each package not yet on it, then
#   the GitHub Release is published and marked latest.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: The exact version on npm beta, without the v (for example 0.1.0)
        type: string
        required: true

permissions: {}

# One promotion at a time, whatever the version, so two runs never read and move latest at once.
concurrency:
  group: promote-latest
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the version on npm
    # Never on a fork, and only from main: the npm-latest environment admits main alone.
    if: github.repository == 'aelmanaa/explorer-verify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checks out the scripts and fetches the tag
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      # Matched as one whole string, so nothing later sees an unchecked value.
      - name: Check the input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be an exact X.Y.Z without the v, for example 0.1.0"
            exit 1
          fi
          echo "## Promote $VERSION to latest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Match the npm used after approval, so preflight exercises the same registry output.
      - name: Install the pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.2.0
          npm --version
      # The release workflow checked the tag before publishing; this checks it again, with the keys
      # and the script of main, before latest moves. --output appends commit= and version=.
      - name: Verify the tag signature, version and commit
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION" "+refs/heads/main:refs/remotes/origin/main"
          set -o pipefail
          node scripts/verify-release-tag.ts "v$VERSION" --output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check the version on npm
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -o pipefail
          node scripts/check-registry-release.ts --version "$VERSION" --commit "$COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

  # Decision 0015: the docs of the version are deployed and every docsUrl answers before latest
  # moves. docs.yml builds the site from tag v<version>, deploys it to GitHub Pages in the
  # github-pages environment, then its smoke job checks each code page, its Markdown copy and
  # llms.txt over HTTPS. A failed build, deploy or smoke job fails this job, and latest does not
  # start. scripts/check-release-workflows.ts fails when latest stops listing this job in needs.
  docs:
    name: Deploy the docs and check every docsUrl
    needs: verify
    # A called workflow gets at most the permissions of the job that calls it. Its deploy job is
    # the only one that uses pages and id-token; build and smoke keep contents: read.
    permissions:
      contents: read # checks out the tag
      pages: write # deploys the site
      id-token: write # the OIDC token actions/deploy-pages needs
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ inputs.version }}

  latest:
    name: Move latest on npm
    needs: [verify, docs]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # A maintainer approves this environment. It admits only main, and each package's trusted
    # publisher for this workflow names it.
    environment: npm-latest
    permissions:
      contents: write # fetches the tag, and publishes the draft GitHub Release
      id-token: write # the OIDC token for npm dist-tag add
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The same pinned npm as release.yml; raise the pin in both files together.
      - name: Install the pinned npm
        run: |
          npm install --global --ignore-scripts npm@12.2.0
          npm --version
      # The verify job may have run hours before the approval, so the registry is read again just
      # before the move. Every package is checked before any tag moves. A package already on
      # latest is left out, so a re-run after a partial move moves only the rest.
      - name: Check the version on npm again
        id: check
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          git fetch --force --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          node scripts/check-registry-release.ts --version "$VERSION" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - name: npm dist-tag add for each package
        env:
          VERSION: ${{ inputs.version }}
          MOVE: ${{ steps.check.outputs.move }}
        run: |
          for name in $MOVE; do
            if ! npm dist-tag add "$name@$VERSION" latest < /dev/null; then
              echo "::error::npm refused to move latest of $name. Check its trusted publisher for promote.yml (environment npm-latest, dist-tag management allowed), or run npm dist-tag add $name@$VERSION latest by hand with 2FA and re-run this workflow."
              exit 1
            fi
            echo "- $name@$VERSION is latest" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish the GitHub Release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
