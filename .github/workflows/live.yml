name: Live check

# Asks the real explorers about contracts the live matrix deployed and verified, once a week
# (R-QA-4, docs/contributor/testing.md#live-check). Unit tests replay recorded answers, so they
# cannot see an explorer change its API, a status string, a host or a CORS header; this run can.
# test/live/targets.json lists the contracts. When a check fails, scripts/live-check.ts opens one
# issue, or comments on the open one with the same title, and the run fails.
#
# It runs on a schedule and on a manual dispatch only, never on a pull request or a push, and only
# in this repository, never on a fork. Its job runs in the `live` environment, whose secrets hold
# the keys and whose deployment branch rule allows `main` only. The script reads each key from the
# environment and never prints it (R-SEC-1).

on:
  schedule:
    # Tuesdays at 05:41 UTC.
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    name: Live check
    if: github.repository == 'aelmanaa/explorer-verify'
    runs-on: ubuntu-26.04
    environment: live
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The script runs the built core package.
      - run: pnpm --filter explorer-verify run build
      # The result goes to the run summary and to an artifact; a failed check also opens or
      # updates the issue. GITHUB_TOKEN is the workflow's own token, limited to the permissions
      # above.
      - name: Run the live check
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/live-check.ts --report --out live-check.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-check-${{ github.run_id }}
          path: live-check.json
          if-no-files-found: warn
          retention-days: 90
