name: Mutation

# Mutation testing with StrykerJS (docs/contributor/testing.md#mutation-testing). The full run is
# slow, so it runs weekly and on manual dispatch, not on every push. A pull request that changes a
# mutated file, the unit tests or the mutation setup gets an incremental run: it restores the
# incremental file of the last full run and tests only the mutants and tests that changed. The
# incremental run does not see changes to files that are neither mutated nor unit test files
# (helpers, fixtures, schemas, other src files, dependencies); only the full run catches those.
# Neither job is a required check. After this workflow first lands, dispatch one full run on main
# to seed the cache that pull requests start from.
on:
  schedule:
    # Mondays at 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/explorer-verify/src/backends/sourcify.ts"
      - "packages/explorer-verify/src/backends/common.ts"
      - "packages/explorer-verify/src/flow/verify.ts"
      - "packages/explorer-verify/src/flow/status.ts"
      - "packages/explorer-verify/src/redact.ts"
      - "packages/explorer-verify/src/errors.ts"
      - "packages/explorer-verify/src/observe.ts"
      - "packages/explorer-verify/src/http/fetch.ts"
      - "packages/explorer-verify/src/http/api-keys.ts"
      - "packages/explorer-verify/src/routing/resolve.ts"
      - "packages/explorer-verify/test/**"
      - "packages/explorer-verify/stryker.config.json"
      - "packages/explorer-verify/mutation-floors.json"
      - "scripts/check-mutation-score.ts"
      - "scripts/mutation-score.ts"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: Mutation (${{ github.event_name == 'pull_request' && 'incremental' || 'full' }})
    runs-on: ubuntu-26.04
    # A full run takes over an hour on 8 cores (docs/contributor/research/2026-11-03-mutation-testing.md)
    # and the runner has 4. An incremental run can be as long as a full one when a pull request
    # changes a test file that reaches most mutants, so both get the same limit.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A pull request starts from the incremental file of the latest full run on main. Caches
      # saved on the default branch are readable from pull requests; a pull request saves none.
      # Each save has a unique key, so `key` never matches: the `restore-keys` prefix, which picks
      # the newest saved file, is the path that restores it.
      - name: Restore the incremental file of the last full run
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/explorer-verify/reports/stryker-incremental.json
          key: stryker-incremental-none
          restore-keys: stryker-incremental-
      # The summary step reads the report even when the floor check fails, so the step's exit code
      # is kept and checked last.
      - name: Run mutation testing and check the floors
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            script=test:mutation:incremental
          else
            script=test:mutation
          fi
          set +e
          pnpm run "$script" | tee mutation-output.txt
          status=${PIPESTATUS[0]}
          {
            echo "## Mutation score ($script)"
            echo
            sed -n '/^| File | Score/,$p' mutation-output.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            packages/explorer-verify/reports/mutation/
            packages/explorer-verify/reports/stryker-incremental.json
          if-no-files-found: warn
          retention-days: 30
      # Only a full run on main updates the file that pull requests start from.
      - name: Save the incremental file
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/explorer-verify/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}-${{ github.run_id }}
