name: Routing table

# Compares the routing table with the Etherscan chainlist, Sourcify's chain list, Routescan's
# two explorer lists and Blockscout's chain registry once a week. All of them answer without a key. When they differ from the table, the workflow opens one issue
# that names each chain and the list it changed in, or updates the open one; when no difference
# remains, it closes that issue. A pull request changes the table; this workflow never does.
# A pull request that drops a chain the CLI names in packages/cli/src/chains.ts removes the name
# there too: a CLI test fails until it does.
#
# A second job watches for signs that Blockscout's per-instance API is going away
# (scripts/blockscout-deprecation.ts, #198).
#
# It runs on a schedule and on a manual dispatch only, never on a pull request, and only in this
# repository, never on a fork. It needs no secret: it uses the workflow's own GITHUB_TOKEN.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-table
  cancel-in-progress: false

jobs:
  compare:
    name: Compare with the chain lists
    if: github.repository == 'aelmanaa/explorer-verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Exits 0 with differences too: the JSON carries them. A list that does not answer fails
      # the step, and GitHub reports the failed run.
      - name: Compare the routing table with the chain lists
        run: node scripts/compare-routing-table.ts --json > routing-report.json
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/routing-table-issue.ts routing-report.json

  # The Blockscout deprecation watch (#198): one keyless GET to each routing-table instance on a
  # host Blockscout runs, 500 ms apart, and one GET to each watched docs page. It opens one issue
  # while it sees a deprecation signal, updates it, and closes it when none remains. A watched docs
  # section that changed stays a signal until a pull request records the new text.
  blockscout-deprecation:
    name: Blockscout deprecation watch
    if: github.repository == 'aelmanaa/explorer-verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The script imports Node built-ins only, so no install. The count of instances that did not
      # answer goes to the run summary and to an artifact each week.
      - name: Run the watch and sync the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/blockscout-deprecation.ts --report --out blockscout-deprecation.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blockscout-deprecation-${{ github.run_id }}
          path: blockscout-deprecation.json
          if-no-files-found: warn
          retention-days: 90
