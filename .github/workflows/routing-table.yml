name: Routing table

# Compares the routing table with the Etherscan chainlist, Sourcify's chain list and Routescan's
# two explorer lists once a week. All of them answer without a key. When they differ from the table, the workflow opens one issue
# that names each chain and the list it changed in, or updates the open one; when no difference
# remains, it closes that issue. A pull request changes the table; this workflow never does.
#
# It runs on a schedule and on a manual dispatch only, never on a pull request, and only in this
# repository, never on a fork. It needs no secret: it uses the workflow's own GITHUB_TOKEN.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routing-table
  cancel-in-progress: false

jobs:
  compare:
    name: Compare with the chain lists
    if: github.repository == 'aelmanaa/explorer-verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Exits 0 with differences too: the JSON carries them. A list that does not answer fails
      # the step, and GitHub reports the failed run.
      - name: Compare the routing table with the chain lists
        run: node scripts/compare-routing-table.ts --json > routing-report.json
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/routing-table-issue.ts routing-report.json
