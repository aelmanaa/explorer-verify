packages:
  - packages/*

linkWorkspacePackages: true

# CI runs `pnpm dedupe --check`; autoDedupe keeps `pnpm install` from writing a lockfile it refuses.
autoDedupe: true
lockfile:
  includeResolutionSettings: true

# Install scripts of dependencies do not run unless listed here. lefthook's only runs
# `lefthook install`, which `prepare` does.
allowBuilds:
  # esbuild's script only checks that the platform binary from its optionalDependencies works.
  esbuild: false
  lefthook: false

# Versions of the development tools, shared by every package. Same versions as hardhat-kms on
# 2026-11-02; Dependabot moves them from here.
catalog:
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@changesets/parse": "1.0.0"
  "@types/node": "^26.6.4"
  "ajv": "8.20.0"
  "c8": "12.0.0"
  "esbuild": "0.28.2"
  "eslint-plugin-jsdoc": "65.4.2"
  "knip": "6.43.0"
  "lefthook": "2.2.2"
  "oxfmt": "0.75.0"
  "oxlint": "1.90.0"
  "oxlint-tsgolint": "7.0.2005"
  "playwright": "1.64.1"
  "publint": "0.3.25"
  "typescript": "7.0.2"
  "yaml": "2.9.1"
  # Pinned exactly: 1.6.4 is the latest stable release (decision 0015). Moving to 2.0 is a site
  # config change, because the pages stay plain Markdown.
  "vitepress": "1.6.4"
