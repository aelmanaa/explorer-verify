packages:
  - packages/*
  # Example applications of the published packages. Private, never published; CI type-checks and
  # tests them.
  - examples
  # The docs site's tools that must not share the root's TypeScript (decisions 0015 and 0028).
  - site

linkWorkspacePackages: true

# CI runs `pnpm dedupe --check`; autoDedupe keeps `pnpm install` from writing a lockfile it refuses.
autoDedupe: true
lockfile:
  includeResolutionSettings: true

# Install scripts of dependencies do not run unless listed here. lefthook's only runs
# `lefthook install`, which `prepare` does.
allowBuilds:
  # esbuild's script only checks that the platform binary from its optionalDependencies works.
  esbuild: false
  lefthook: false

# typed-rest-client 2.3.1 (under @stryker-mutator/core) pins qs 6.15.1, which has four moderate
# advisories fixed by 6.16.1 (GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g,
# GHSA-6pq8-jhm2-2vcw). Drop this when typed-rest-client takes a fixed qs.
overrides:
  "typed-rest-client>qs": "6.16.1"

# Versions of the development tools, shared by every package. Same versions as hardhat-kms on
# 2026-11-02; Dependabot moves them from here.
catalog:
  "@arethetypeswrong/cli": "0.18.5"
  # The parser of scripts/mutation-shards.ts. Same version as the one Stryker installs through
  # @babel/core, so the lockfile gains no package and the shards cut where Stryker reads nodes.
  "@babel/parser": "8.0.7"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@changesets/parse": "1.0.0"
  "@stryker-mutator/core": "10.1.1"
  "@stryker-mutator/tap-runner": "10.1.1"
  "@types/node": "^22.18.0"
  "ajv": "8.20.0"
  "c8": "12.0.0"
  "esbuild": "0.28.2"
  "eslint-plugin-jsdoc": "65.4.2"
  "knip": "6.44.1"
  "lefthook": "2.2.2"
  "oxfmt": "0.75.0"
  "oxlint": "1.90.0"
  "oxlint-tsgolint": "7.0.2005"
  "playwright": "1.64.1"
  "publint": "0.3.25"
  # The Rollup build of scripts/check-names.ts. Same version as the one VitePress installs through
  # Vite, so the lockfile gains no package.
  "rollup": "4.68.0"
  "typescript": "7.0.2"
  "typedoc": "0.28.20"
  "typedoc-plugin-markdown": "4.14.1"
  "yaml": "2.9.1"
  # Pinned exactly: 1.6.4 is the latest stable release (decision 0015). Moving to 2.0 is a site
  # config change, because the pages stay plain Markdown.
  "vitepress": "1.6.4"

catalogs:
  # TypeDoc reads the TypeScript 6 API, and TypeScript 7.0 ships none (decision 0015). Only the
  # `site` package installs this alias, so TypeDoc's `typescript` peer resolves to it there, and
  # TypeScript 7 stays the type checker everywhere else.
  typedoc:
    typescript: "npm:@typescript/typescript6@6.0.2"
