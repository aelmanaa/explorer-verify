<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
<title>explorer-verify</title>
<!-- Match seal on a 16px grid. Tile: full square, r 3.5, stamp-ink blue (white glyph 7.1:1;
     tile stays visible on light and dark tab bars). Glyph: an equals sign whose lower bar
     turns into a check. 2px strokes on whole-pixel rows: top bar y 5-7, lower bar y 9-11,
     both start at x 3. Check: 3.6px of bar, 2px drop, rise to (13.2,5). -->
<rect width="16" height="16" rx="3.5" fill="#3346D3"/>
<path d="M3 6h4M3 10h3.6l2 2L13.2 5" fill="none" stroke="#fff" stroke-width="2"/>
</svg>
